<!doctype html>
<html lang="ru">
<head>

  <style>
:root { --ink:#1a1a2e; --muted:#64748b; --accent:#2563eb; --paper:#ffffff; --bg:#f8fafc; --border:#e2e8f0; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.7 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
.doc { max-width:820px; margin:32px auto; background:var(--paper); box-shadow:0 4px 24px rgba(0,0,0,.06); border-radius:16px; overflow:hidden; }
.head { padding:32px 36px 24px; border-bottom:2px solid var(--border); position:relative; }
.brand { position:absolute; right:36px; top:32px; border:2px solid var(--accent); color:var(--accent); padding:6px 14px; border-radius:999px; font-weight:800; font-size:11px; letter-spacing:.12em; text-transform:uppercase; }
h1 { margin:0 0 8px; font-size:26px; line-height:1.25; }
.meta { color:var(--muted); font-size:14px; }
.body { padding:28px 36px 40px; }
.body h2 { margin:28px 0 12px; font-size:20px; color:var(--accent); border-bottom:1px solid var(--border); padding-bottom:6px; }
.body h3 { margin:20px 0 8px; font-size:17px; }
.body p { margin:0 0 12px; }
.body ul, .body ol { margin:0 0 12px; padding-left:24px; }
.body li { margin-bottom:4px; }
.body table { width:100%; border-collapse:collapse; margin:0 0 16px; font-size:15px; }
.body th, .body td { border:1px solid var(--border); padding:8px 12px; text-align:left; }
.body th { background:#f1f5f9; font-weight:600; }
.body pre { background:#1e293b; color:#e2e8f0; padding:16px; border-radius:8px; overflow-x:auto; margin:0 0 16px; font-size:14px; }
.body code { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:0.92em; }
.body p code, .body li code { background:#f1f5f9; padding:2px 6px; border-radius:4px; color:#0f172a; }
.body a { color:var(--accent); text-decoration:none; border-bottom:1px solid transparent; }
.body a:hover { border-bottom-color:var(--accent); }
.checklist { list-style:none; padding-left:4px; }
.checklist li { display:flex; align-items:center; gap:8px; }
.checklist input { width:16px; height:16px; }
.footer { padding:20px 36px; border-top:1px solid var(--border); color:var(--muted); font-size:13px; text-align:center; }
@media print { body { background:#fff; } .doc { box-shadow:none; margin:0; max-width:none; border-radius:0; } .body h2 { page-break-before:auto; } }
@media (max-width:640px) { .head, .body, .footer { padding-left:20px; padding-right:20px; } h1 { font-size:22px; } }
</style>
</head>

    </div>
    <div class="footer">Expovision AI Intensive &copy; 2026</div>
  </article>
</body>
</html>
